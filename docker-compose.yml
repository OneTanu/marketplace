# Local development only. Start with: docker compose up
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tanu
      POSTGRES_USER: tanu
      POSTGRES_PASSWORD: tanu
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tanu"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    # exec makes runserver the main process, so Ctrl+C / docker stop reach Django directly.
    command: sh -c "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    # Lets E2E runs (web/playwright.config.ts) reach Postgres via the host port on Linux too;
    # Docker Desktop provides host.docker.internal already.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
