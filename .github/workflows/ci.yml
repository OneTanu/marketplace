name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older, now-irrelevant run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide which parts of the repo changed. Jobs below are skipped (not left
  # pending) when their folder is untouched, so they can still be required checks.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tanu
          POSTGRES_USER: tanu
          POSTGRES_PASSWORD: tanu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tanu"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: No missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI contract is up to date
        run: |
          uv run python manage.py spectacular --file "$RUNNER_TEMP/openapi.yaml"
          diff ../contracts/openapi.yaml "$RUNNER_TEMP/openapi.yaml"
      - name: Tests
        run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in web/package.json ("packageManager").
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date
        run: |
          pnpm api:types
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  # Playwright against the real stack: Next.js (production build) proxying to Django and
  # Postgres. playwright.config.ts starts both servers; Django runs with uv here.
  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tanu
          POSTGRES_USER: tanu
          POSTGRES_PASSWORD: tanu
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tanu"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm e2e
      - name: Upload Playwright report
        # cancelled() covers hitting timeout-minutes.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
