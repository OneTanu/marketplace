          maxLength: 50
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        signup_is_open:
          type: boolean
        marketplace_status:
          $ref: '#/components/schemas/MarketplaceStatusEnum'
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          maxLength: 2
        domains:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - domains
      - name
      - short_name
      - slug
    SchoolRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        short_name:
          type: string
          minLength: 1
          maxLength: 50
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        signup_is_open:
          type: boolean
        marketplace_status:
          $ref: '#/components/schemas/MarketplaceStatusEnum'
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          minLength: 1
          maxLength: 2
      required:
      - name
      - short_name
      - slug
