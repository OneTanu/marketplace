openapi: 3.0.3
info:
  title: Tanu API
  version: 0.1.0
  description: Marketplace API shared by the Tanu web and mobile apps.
paths:
  /api/blocks/:
    get:
      operationId: blocks_list
      description: The students I've blocked, and blocking another one.
      tags:
      - blocks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedUser'
          description: ''
    post:
      operationId: blocks_create
      description: The students I've blocked, and blocking another one.
      tags:
      - blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlockCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlockCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUser'
          description: ''
  /api/blocks/{username}/:
    delete:
      operationId: blocks_destroy
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - blocks
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_list
      description: Active categories, optionally for one listing kind.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - item
          - service
        description: Only this listing kind.
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/conversations/:
    get:
      operationId: conversations_list
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: conversations_create
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/conversations/{id}/:
    get:
      operationId: conversations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/conversations/{id}/messages/:
    get:
      operationId: conversations_messages_retrieve
      parameters:
      - in: query
        name: after_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: before_id
        schema:
          type: integer
          minimum: 1
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: conversations_messages_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/conversations/{id}/read/:
    post:
      operationId: conversations_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/conversations/unread-count/:
    get:
      operationId: conversations_unread_count_retrieve
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/deals/:
    get:
      operationId: deals_list
      parameters:
      - in: query
        name: conversation
        schema:
          type: integer
          minimum: 1
      tags:
      - deals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{deal_id}/reviews/:
    get:
      operationId: deals_reviews_list
      parameters:
      - in: path
        name: deal_id
        schema:
          type: integer
        required: true
      tags:
      - deals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          description: ''
    post:
      operationId: deals_reviews_create
      parameters:
      - in: path
        name: deal_id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/deals/{id}/:
    get:
      operationId: deals_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{id}/accept/:
    post:
      operationId: deals_accept_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptDealRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptDealRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptDealRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{id}/cancel/:
    post:
      operationId: deals_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{id}/confirm-handoff/:
    post:
      operationId: deals_confirm_handoff_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{id}/counter/:
    post:
      operationId: deals_counter_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CounterOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CounterOfferRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{id}/decline/:
    post:
      operationId: deals_decline_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{id}/meetup-proposals/:
    post:
      operationId: deals_meetup_proposals_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetupProposalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetupProposalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetupProposalCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetupProposal'
          description: ''
  /api/deals/{id}/meetup-proposals/accept/:
    post:
      operationId: deals_meetup_proposals_accept_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetupProposalAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetupProposalAcceptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetupProposalAcceptRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetupProposal'
          description: ''
  /api/deals/{id}/meetup-status/:
    post:
      operationId: deals_meetup_status_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetupStatusCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetupStatusCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetupStatusCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetupStatusUpdate'
          description: ''
  /api/deals/{id}/trade-offer/:
    post:
      operationId: deals_trade_offer_create
      description: |-
        Offer a trade package (some of the buyer's items, plus optional cash from either side)
        on a trade request. The seller sends the first one; after that each side can counter.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TradeOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TradeOfferRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/deals/{id}/trade-options/:
    get:
      operationId: deals_trade_options_list
      description: |-
        The buyer's Available items that can go into a trade package. Only the two people in
        the deal can see it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - deals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DealListing'
          description: ''
  /api/listings/:
    get:
      operationId: listings_list
      description: |-
        The feed: Available and Pending listings at your school (or the school asked for),
        filtered, newest first by default, a page at a time. Sold and Removed listings aren't
        included.
      parameters:
      - in: query
        name: brand
        schema:
          type: string
          minLength: 1
        description: Exact brand, any case.
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
        description: A category slug. Includes every category under it.
      - in: query
        name: color
        schema:
          type: array
          items:
            enum:
            - black
            - white
            - gray
            - brown
            - beige
            - red
            - pink
            - orange
            - yellow
            - green
            - blue
            - purple
            - gold
            - silver
            - multi
            type: string
            description: |-
              * `black` - Black
              * `white` - White
              * `gray` - Gray
              * `brown` - Brown
              * `beige` - Beige
              * `red` - Red
              * `pink` - Pink
              * `orange` - Orange
              * `yellow` - Yellow
              * `green` - Green
              * `blue` - Blue
              * `purple` - Purple
              * `gold` - Gold
              * `silver` - Silver
              * `multi` - Multicolor
      - in: query
        name: condition
        schema:
          type: array
          items:
            enum:
            - new_with_tags
            - like_new
            - good
            - fair
            - poor
            type: string
            description: |-
              * `new_with_tags` - New with tags
              * `like_new` - Like new
              * `good` - Good
              * `fair` - Fair
              * `poor` - Poor
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: '`next_cursor` from the last page, with the same sort.'
      - in: query
        name: max_price
        schema:
          type: integer
          minimum: 0
        description: In cents.
      - in: query
        name: min_price
        schema:
          type: integer
          minimum: 0
        description: In cents.
      - in: query
        name: school
        schema:
          type: string
          minLength: 1
        description: A school slug, or "all". Defaults to your school.
      - in: query
        name: size
        schema:
          type: string
          minLength: 1
        description: Exact size, any case, e.g. 32x30.
      - in: query
        name: sort
        schema:
          enum:
          - newest
          - price_asc
          - price_desc
          type: string
          default: newest
          minLength: 1
        description: |-
          * `newest` - newest
          * `price_asc` - price_asc
          * `price_desc` - price_desc
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingFeedPage'
          description: ''
    post:
      operationId: listings_create
      description: |-
        Post an item listing at the seller's school. Photos are sent as repeated `photos`
        files, in order.
      tags:
      - listings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/listings/{listing_id}/deals/:
    post:
      operationId: listings_deals_create
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateDealRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDealRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deal'
          description: ''
  /api/listings/{listing_id}/meetup-options/:
    get:
      operationId: listings_meetup_options_retrieve
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetupOptions'
          description: ''
  /api/listings/{id}/:
    get:
      operationId: listings_retrieve
      description: |-
        Any signed-in student can fetch a listing, whatever its school. A Removed listing is a
        404 for everyone but its seller.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
    patch:
      operationId: listings_partial_update
      description: |-
        Edit an Available listing (seller only). Send only the fields that change; item
        details go in a nested `item_details` object.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListingUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
    delete:
      operationId: listings_destroy
      description: |-
        Remove an Available listing (seller only). It's a soft delete: the listing stays
        for its seller's records but is a 404 for everyone else.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          description: The listing isn't Available, so it can't be removed.
  /api/listings/{id}/photos/:
    post:
      operationId: listings_photos_create
      description: |-
        Add one photo to an Available listing (seller only), after its other photos.
        A listing has at most 10 photos. Returns the whole listing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingPhotoUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
  /api/listings/{id}/photos/{photo_id}/:
    delete:
      operationId: listings_photos_destroy
      description: |-
        Delete a photo from an Available listing (seller only). A listing's last photo
        can't be deleted. Later photos move up. Returns the whole listing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: photo_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
  /api/listings/{id}/photos/order/:
    put:
      operationId: listings_photos_order_update
      description: Reorder an Available listing's photos (seller only). Returns the
        whole listing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingPhotoOrderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
  /api/listings/mine/:
    get:
      operationId: listings_mine_list
      description: |-
        The signed-in seller's own listings, newest first. Listings they removed are left
        out; listings moderation removed are included, with `removed_by` set.
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - available
          - pending
          - removed
          - sold
        description: Only listings with this status.
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listing'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    put:
      operationId: me_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurrentUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurrentUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
