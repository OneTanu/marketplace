components:
  schemas:
    AcceptDealRequest:
      type: object
      properties:
        meetup_proposal_id:
          type: integer
          minimum: 1
    AvailabilityOverride:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        is_unavailable:
          type: boolean
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
      required:
      - date
      - id
    AvailabilityOverrideRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        is_unavailable:
          type: boolean
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
      required:
      - date
    AvailabilityWindow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - end_time
      - id
      - start_time
      - weekday
    AvailabilityWindowRequest:
      type: object
      properties:
        weekday:
          type: integer
          maximum: 6
          minimum: 0
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
      required:
      - end_time
      - start_time
      - weekday
    BlankEnum:
      enum:
      - ''
    BlockCreateRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
      required:
      - username
    BlockedUser:
      type: object
      properties:
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - first_name
      - username
    CashPayerEnum:
      enum:
      - buyer
      - seller
      type: string
      description: |-
        * `buyer` - Buyer
        * `seller` - Seller
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          readOnly: true
          nullable: true
      required:
      - id
      - name
      - parent
      - slug
    ColorEnum:
      enum:
      - black
      - white
      - gray
      - brown
      - beige
      - red
      - pink
      - orange
      - yellow
      - green
      - blue
      - purple
      - gold
      - silver
      - multi
      type: string
      description: |-
        * `black` - Black
        * `white` - White
        * `gray` - Gray
        * `brown` - Brown
        * `beige` - Beige
        * `red` - Red
        * `pink` - Pink
        * `orange` - Orange
        * `yellow` - Yellow
        * `green` - Green
        * `blue` - Blue
        * `purple` - Purple
        * `gold` - Gold
        * `silver` - Silver
        * `multi` - Multicolor
    ConditionEnum:
      enum:
      - new_with_tags
      - like_new
      - good
      - fair
      - poor
      type: string
      description: |-
        * `new_with_tags` - New with tags
        * `like_new` - Like new
        * `good` - Good
        * `fair` - Fair
        * `poor` - Poor
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        other_user:
          allOf:
          - $ref: '#/components/schemas/MessagingUser'
          readOnly: true
        latest_message:
          allOf:
          - $ref: '#/components/schemas/Message'
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - last_message_at
      - latest_message
      - other_user
      - unread_count
    CounterOfferRequest:
      type: object
      properties:
        amount_cents:
          type: integer
          minimum: 1
        meetup_proposal_id:
          type: integer
          minimum: 1
      required:
      - amount_cents
    CreateDealRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/DealKind'
        amount_cents:
          type: integer
          minimum: 1
        asap:
          type: boolean
          default: false
        meeting_spot_id:
          type: integer
          minimum: 1
          writeOnly: true
        proposed_starts_at:
          type: array
          items:
            type: string
            format: date-time
          writeOnly: true
          maxItems: 2
          minItems: 1
      required:
      - kind
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        school:
          allOf:
          - $ref: '#/components/schemas/School'
          readOnly: true
          nullable: true
        instagram_handle:
          type: string
        profile_description:
          type: string
          maxLength: 300
        follower_count:
          type: integer
          readOnly: true
        following_count:
          type: integer
          readOnly: true
        sold_count:
          type: integer
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - follower_count
      - following_count
      - id
      - last_name
      - school
      - sold_count
      - username
    CurrentUserRequest:
      type: object
      properties:
        instagram_handle:
          type: string
        profile_description:
          type: string
          maxLength: 300
    Deal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        listing:
          allOf:
          - $ref: '#/components/schemas/DealListing'
          readOnly: true
        buyer:
          allOf:
          - $ref: '#/components/schemas/DealUser'
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/DealUser'
          readOnly: true
        conversation:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/DealKind'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DealStatus'
          readOnly: true
        current_amount_cents:
          type: integer
          readOnly: true
        agreed_amount_cents:
          type: integer
          readOnly: true
          nullable: true
        currency:
          type: string
          readOnly: true
        response_deadline:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        handoff_deadline:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        buyer_confirmed:
          type: boolean
          readOnly: true
        seller_confirmed:
          type: boolean
          readOnly: true
        my_role:
          type: string
          readOnly: true
        awaiting_me:
          type: boolean
          readOnly: true
        asap:
          type: boolean
          readOnly: true
        offers:
          type: array
          items:
            $ref: '#/components/schemas/DealOffer'
          readOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/DealEvent'
          readOnly: true
        meetup_proposals:
          type: array
          items:
            $ref: '#/components/schemas/MeetupProposal'
          readOnly: true
        meetup_updates:
          type: array
          items:
            $ref: '#/components/schemas/MeetupStatusUpdate'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agreed_amount_cents
      - asap
      - awaiting_me
      - buyer
      - buyer_confirmed
      - conversation
      - created_at
      - currency
      - current_amount_cents
      - events
      - handoff_deadline
      - id
      - kind
      - listing
      - meetup_proposals
      - meetup_updates
      - my_role
      - offers
      - response_deadline
      - seller
      - seller_confirmed
      - status
      - updated_at
    DealEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          type: string
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/DealUser'
          readOnly: true
          nullable: true
        data:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - data
      - event_type
      - id
    DealKind:
      enum:
      - buy_now
      - offer
      - trade
      type: string
      description: |-
        * `buy_now` - Buy now
        * `offer` - Offer
        * `trade` - Trade
    DealListing:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        price_cents:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        school_slug:
          type: string
          readOnly: true
        school_name:
          type: string
          readOnly: true
        cover_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - cover_url
      - currency
      - id
      - price_cents
      - school_name
      - school_slug
      - status
      - title
    DealOffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        offered_by:
          allOf:
          - $ref: '#/components/schemas/DealUser'
          readOnly: true
        amount_cents:
          type: integer
          readOnly: true
        trade_items:
          type: array
          items:
            $ref: '#/components/schemas/DealListing'
          readOnly: true
        cash_payer:
          allOf:
          - $ref: '#/components/schemas/CashPayerEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_cents
      - cash_payer
      - created_at
      - id
      - offered_by
      - trade_items
    DealStatus:
      enum:
      - awaiting_seller
      - awaiting_buyer
      - backup
      - pending
      - completed
      - canceled
      - declined
      - expired
      type: string
      description: |-
        * `awaiting_seller` - Awaiting seller
        * `awaiting_buyer` - Awaiting buyer
        * `backup` - Backup
        * `pending` - Pending handoff
        * `completed` - Completed
        * `canceled` - Canceled
        * `declined` - Declined
        * `expired` - Expired
    DealUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
      required:
      - first_name
      - id
      - username
    ItemDetails:
      type: object
      properties:
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionEnum'
          readOnly: true
        size:
          type: string
          readOnly: true
        brand:
          type: string
          readOnly: true
        color:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ColorEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - brand
      - color
      - condition
      - size
    ItemDetailsUpdateRequest:
      type: object
      properties:
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        size:
          type: string
          maxLength: 30
        brand:
          type: string
          maxLength: 100
        color:
          oneOf:
          - $ref: '#/components/schemas/ColorEnum'
          - $ref: '#/components/schemas/BlankEnum'
    Kind2e0Enum:
      enum:
      - running_late
      - arrived
      type: string
      description: |-
        * `running_late` - Running late
        * `arrived` - Arrived
    KindEnum:
      enum:
      - item
      - service
      type: string
      description: |-
        * `item` - Item
        * `service` - Service
    Listing:
      type: object
      description: A listing as returned by the API.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        removed_by:
          description: 'Who removed a Removed listing, shown only to its seller: blank
            unless the listing is Removed, and null for everyone else.'
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RemovedByEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        price_cents:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        school:
          allOf:
          - $ref: '#/components/schemas/SchoolSummary'
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/SellerSummary'
          readOnly: true
        item_details:
          allOf:
          - $ref: '#/components/schemas/ItemDetails'
          readOnly: true
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ListingPhoto'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - currency
      - description
      - id
      - item_details
      - kind
      - photos
      - price_cents
      - removed_by
      - school
      - seller
      - status
      - title
      - updated_at
    ListingCard:
      type: object
      description: |-
        A listing as a feed card: enough to show and link it, without description or every
        photo. Expects the queryset from views.card_queryset (cover photo prefetched).
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        price_cents:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        cover_url:
          type: string
          nullable: true
          readOnly: true
          description: The cover photo's thumbnail, or its full image until the thumbnail
            job has made one.
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionEnum'
          readOnly: true
        size:
          type: string
          readOnly: true
        brand:
          type: string
          readOnly: true
        school:
          allOf:
          - $ref: '#/components/schemas/SchoolSummary'
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/SellerSummary'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand
      - condition
      - cover_url
      - created_at
      - currency
      - id
      - price_cents
      - school
      - seller
      - size
      - status
      - title
    ListingCreateRequest:
      type: object
      description: |-
        Multipart input for creating an item listing. Kind, school, currency and status are set
        by the server, so they aren't fields here and are ignored if sent.
      properties:
        category:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          default: ''
          maxLength: 5000
        price_cents:
          type: integer
          maximum: 1000000
          minimum: 0
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        size:
          type: string
          default: ''
          maxLength: 30
        brand:
          type: string
          default: ''
          maxLength: 100
        color:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ColorEnum'
          - $ref: '#/components/schemas/BlankEnum'
        photos:
          type: array
          items:
            type: string
            format: binary
          description: 1 to 10 JPEG, PNG or WebP files of up to 10 MB each, in order.
            The first is the cover.
      required:
      - category
      - condition
      - photos
      - price_cents
      - title
    ListingFeedPage:
      type: object
      properties:
        results:
          type: array
          items:
