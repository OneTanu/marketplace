openapi: 3.0.3
info:
  title: Tanu API
  version: 0.1.0
  description: Marketplace API shared by the Tanu web and mobile apps.
paths:
  /api/categories/:
    get:
      operationId: categories_list
      description: Active categories, optionally for one listing kind.
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - item
          - service
        description: Only this listing kind.
      tags:
      - categories
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/conversations/:
    get:
      operationId: conversations_list
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: conversations_create
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/conversations/{id}/:
    get:
      operationId: conversations_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/conversations/{id}/messages/:
    get:
      operationId: conversations_messages_retrieve
      parameters:
      - in: query
        name: after_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: before_id
        schema:
          type: integer
          minimum: 1
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
          description: ''
    post:
      operationId: conversations_messages_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/conversations/{id}/read/:
    post:
      operationId: conversations_read_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/conversations/unread-count/:
    get:
      operationId: conversations_unread_count_retrieve
      tags:
      - conversations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/listings/:
    post:
      operationId: listings_create
      description: |-
        Post an item listing at the seller's school. Photos are sent as repeated `photos`
        files, in order.
      tags:
      - listings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
  /api/listings/{id}/:
    get:
      operationId: listings_retrieve
      description: |-
        Any signed-in student can fetch a listing, whatever its school. A Removed listing is a
        404 for everyone but its seller.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
    patch:
      operationId: listings_partial_update
      description: |-
        Edit an Available listing (seller only). Send only the fields that change; item
        details go in a nested `item_details` object.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedListingUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
    delete:
      operationId: listings_destroy
      description: |-
        Remove an Available listing (seller only). It's a soft delete: the listing stays
        for its seller's records but is a 404 for everyone else.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '409':
          description: The listing isn't Available, so it can't be removed.
  /api/listings/{id}/photos/:
    post:
      operationId: listings_photos_create
      description: |-
        Add one photo to an Available listing (seller only), after its other photos.
        A listing has at most 10 photos. Returns the whole listing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListingPhotoUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
  /api/listings/{id}/photos/{photo_id}/:
    delete:
      operationId: listings_photos_destroy
      description: |-
        Delete a photo from an Available listing (seller only). A listing's last photo
        can't be deleted. Later photos move up. Returns the whole listing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: photo_id
        schema:
          type: integer
        required: true
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
  /api/listings/{id}/photos/order/:
    put:
      operationId: listings_photos_order_update
      description: Reorder an Available listing's photos (seller only). Returns the
        whole listing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - listings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingPhotoOrderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
        '409':
          description: The listing isn't Available, so it can't be edited.
  /api/listings/mine/:
    get:
      operationId: listings_mine_list
      description: |-
        The signed-in seller's own listings, newest first. Listings they removed are left
        out; listings moderation removed are included, with `removed_by` set.
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - available
          - pending
          - removed
          - sold
        description: Only listings with this status.
      tags:
      - listings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Listing'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    put:
      operationId: me_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CurrentUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CurrentUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    patch:
      operationId: me_partial_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/schools/:
    get:
      operationId: schools_list
      description: Public directory of schools known to Tanu and their marketplace
        state.
      tags:
      - schools
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
          description: ''
  /api/schools/{slug}/:
    get:
      operationId: schools_retrieve
      description: Public directory of schools known to Tanu and their marketplace
        state.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - schools
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
          description: ''
  /api/users/:
    get:
      operationId: users_list
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Text to match against usernames and first names.
      - in: query
        name: school
        schema:
          type: string
        description: A school slug, or "all". Defaults to the signed-in user's school.
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicUser'
          description: ''
  /api/users/{username}/:
    get:
      operationId: users_retrieve
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
          description: ''
  /api/users/{username}/follow/:
    post:
      operationId: users_follow_create
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
          description: ''
    delete:
      operationId: users_follow_destroy
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - users
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        parent:
          type: integer
          readOnly: true
          nullable: true
      required:
      - id
      - name
      - parent
      - slug
    ColorEnum:
      enum:
      - black
      - white
      - gray
      - brown
      - beige
      - red
      - pink
      - orange
      - yellow
      - green
      - blue
      - purple
      - gold
      - silver
      - multi
      type: string
      description: |-
        * `black` - Black
        * `white` - White
        * `gray` - Gray
        * `brown` - Brown
        * `beige` - Beige
        * `red` - Red
        * `pink` - Pink
        * `orange` - Orange
        * `yellow` - Yellow
        * `green` - Green
        * `blue` - Blue
        * `purple` - Purple
        * `gold` - Gold
        * `silver` - Silver
        * `multi` - Multicolor
    ConditionEnum:
      enum:
      - new_with_tags
      - like_new
      - good
      - fair
      - poor
      type: string
      description: |-
        * `new_with_tags` - New with tags
        * `like_new` - Like new
        * `good` - Good
        * `fair` - Fair
        * `poor` - Poor
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        other_user:
          allOf:
          - $ref: '#/components/schemas/MessagingUser'
          readOnly: true
        latest_message:
          allOf:
          - $ref: '#/components/schemas/Message'
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - last_message_at
      - latest_message
      - other_user
      - unread_count
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        school:
          allOf:
          - $ref: '#/components/schemas/School'
          readOnly: true
          nullable: true
        instagram_handle:
          type: string
        profile_description:
          type: string
          maxLength: 300
        follower_count:
          type: integer
          readOnly: true
        following_count:
          type: integer
          readOnly: true
      required:
      - email
      - first_name
      - follower_count
      - following_count
      - id
      - last_name
      - school
      - username
    CurrentUserRequest:
      type: object
      properties:
        instagram_handle:
          type: string
        profile_description:
          type: string
          maxLength: 300
    ItemDetails:
      type: object
      properties:
        condition:
          allOf:
          - $ref: '#/components/schemas/ConditionEnum'
          readOnly: true
        size:
          type: string
          readOnly: true
        brand:
          type: string
          readOnly: true
        color:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ColorEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - brand
      - color
      - condition
      - size
    ItemDetailsUpdateRequest:
      type: object
      properties:
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        size:
          type: string
          maxLength: 30
        brand:
          type: string
          maxLength: 100
        color:
          oneOf:
          - $ref: '#/components/schemas/ColorEnum'
          - $ref: '#/components/schemas/BlankEnum'
    KindEnum:
      enum:
      - item
      - service
      type: string
      description: |-
        * `item` - Item
        * `service` - Service
    Listing:
      type: object
      description: A listing as returned by the API.
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        removed_by:
          description: 'Who removed a Removed listing, shown only to its seller: blank
            unless the listing is Removed, and null for everyone else.'
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RemovedByEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        price_cents:
          type: integer
          readOnly: true
        currency:
          type: string
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        school:
          allOf:
          - $ref: '#/components/schemas/SchoolSummary'
          readOnly: true
        seller:
          allOf:
          - $ref: '#/components/schemas/SellerSummary'
          readOnly: true
        item_details:
          allOf:
          - $ref: '#/components/schemas/ItemDetails'
          readOnly: true
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ListingPhoto'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - currency
      - description
      - id
      - item_details
      - kind
      - photos
      - price_cents
      - removed_by
      - school
      - seller
      - status
      - title
      - updated_at
    ListingCreateRequest:
      type: object
      description: |-
        Multipart input for creating an item listing. Kind, school, currency and status are set
        by the server, so they aren't fields here and are ignored if sent.
      properties:
        category:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          default: ''
          maxLength: 5000
        price_cents:
          type: integer
          maximum: 1000000
          minimum: 0
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        size:
          type: string
          default: ''
          maxLength: 30
        brand:
          type: string
          default: ''
          maxLength: 100
        color:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ColorEnum'
          - $ref: '#/components/schemas/BlankEnum'
        photos:
          type: array
          items:
            type: string
            format: binary
          description: 1 to 10 JPEG, PNG or WebP files of up to 10 MB each, in order.
            The first is the cover.
      required:
      - category
      - condition
      - photos
      - price_cents
      - title
    ListingPhoto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        position:
          type: integer
          readOnly: true
        image_url:
          type: string
          readOnly: true
        thumbnail_url:
          type: string
          nullable: true
          readOnly: true
          description: A 400 px (long edge) copy for lists. Null until the background
            job has made it; show image_url until then.
      required:
      - id
      - image_url
      - position
      - thumbnail_url
    ListingPhotoOrderRequest:
      type: object
      properties:
        photo_ids:
          type: array
          items:
            type: integer
          description: Every photo ID of the listing, each once, in the new order.
            The first is the cover.
      required:
      - photo_ids
    ListingPhotoUploadRequest:
      type: object
      properties:
        photo:
          type: string
          format: binary
          description: One JPEG, PNG or WebP file of up to 10 MB. It goes after the
            other photos.
      required:
      - photo
    MarkReadRequest:
      type: object
      properties:
        message_id:
          type: integer
          minimum: 1
    MarketplaceStatusEnum:
      enum:
      - planned
      - waitlist
      - open
      - paused
      type: string
      description: |-
        * `planned` - Planned
        * `waitlist` - Waitlist
        * `open` - Open
        * `paused` - Paused
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
          readOnly: true
        sender:
          allOf:
          - $ref: '#/components/schemas/MessagingUser'
          readOnly: true
        body:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_mine:
          type: boolean
          readOnly: true
      required:
      - body
      - conversation
      - created_at
      - id
      - is_mine
      - sender
    MessagePage:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          readOnly: true
        has_more:
          type: boolean
          readOnly: true
      required:
      - has_more
      - messages
    MessagingUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        school:
          allOf:
          - $ref: '#/components/schemas/School'
          readOnly: true
          nullable: true
      required:
      - first_name
      - id
      - school
      - username
    NullEnum:
      enum:
      - null
    PatchedCurrentUserRequest:
      type: object
      properties:
        instagram_handle:
          type: string
        profile_description:
          type: string
          maxLength: 300
    PatchedListingUpdateRequest:
      type: object
      description: |-
        JSON input for editing an Available item listing. Every field is optional; fields left
        out keep their value. Kind, school, currency and status aren't fields here and are ignored
        if sent. The category and Free/$0 rules are checked by the update service, against the
        listing's resulting category and price.
      properties:
        category:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        price_cents:
          type: integer
          maximum: 1000000
          minimum: 0
        item_details:
          $ref: '#/components/schemas/ItemDetailsUpdateRequest'
    PublicUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        school:
