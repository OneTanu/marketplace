openapi: 3.0.3
info:
  title: Tanu API
  version: 0.1.0
  description: Marketplace API shared by the Tanu web and mobile apps.
paths:
  /api/me/:
    get:
      operationId: me_retrieve
      tags:
      - me
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/schools/:
    get:
      operationId: schools_list
      description: Public directory of schools known to Tanu and their marketplace
        state.
      tags:
      - schools
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/School'
          description: ''
  /api/schools/{slug}/:
    get:
      operationId: schools_retrieve
      description: Public directory of schools known to Tanu and their marketplace
        state.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - schools
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
          description: ''
components:
  schemas:
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        school:
          allOf:
          - $ref: '#/components/schemas/School'
          readOnly: true
      required:
      - email
      - id
      - school
    MarketplaceStatusEnum:
      enum:
      - planned
      - waitlist
      - open
      - paused
      type: string
      description: |-
        * `planned` - Planned
        * `waitlist` - Waitlist
        * `open` - Open
        * `paused` - Paused
    School:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        short_name:
          type: string
          maxLength: 50
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        signup_is_open:
          type: boolean
        marketplace_status:
          $ref: '#/components/schemas/MarketplaceStatusEnum'
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country_code:
          type: string
          maxLength: 2
        timezone:
          type: string
          maxLength: 64
        domains:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - domains
      - name
      - short_name
      - slug
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
