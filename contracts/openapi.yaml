          readOnly: true
          nullable: true
        instagram_handle:
          type: string
          readOnly: true
        profile_description:
          type: string
          readOnly: true
        follower_count:
          type: integer
          readOnly: true
        following_count:
          type: integer
          readOnly: true
        is_following:
          type: boolean
          readOnly: true
        is_self:
